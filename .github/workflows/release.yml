name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the tag (for example 0.2.0)
        required: true
        default: "0.2.0"
      create_release:
        description: Create or update a GitHub release and attach the built artifacts
        required: true
        type: boolean
        default: true

permissions:
  contents: write

env:
  HUXERUI_REVISION: cadb1696cfa7b87d9d2d316b3ecba07b85a46962
  APP_NAME: pdf-preview

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            archive: zip
          - name: linux-x86_64
            os: ubuntu-latest
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            archive: tar.gz
          - name: macos-arm64
            os: macos-15
            arch: arm64
            archive: zip
          - name: macos-x86_64
            os: macos-15
            arch: x86_64
            archive: zip
    steps:
      - uses: actions/checkout@v4
      - name: Check out verified HuxerUI revision
        uses: actions/checkout@v4
        with:
          repository: HuxerUI/HuxerUI
          ref: ${{ env.HUXERUI_REVISION }}
          path: .cache/HuxerUI
      - name: Select Xcode 26.2
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libepoxy-dev libsoup-3.0-dev libpango1.0-dev libfontconfig1-dev libglib2.0-dev
      - name: Resolve project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION is not a semantic version: $version" >&2; exit 1; }
          echo "PDF_PREVIEW_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building ${APP_NAME} ${version} for ${{ matrix.name }}"
      - name: Configure preview
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [[ -n "${{ matrix.arch }}" ]]; then
            extra+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}")
          fi
          cmake -S examples/preview -B build-release -DCMAKE_BUILD_TYPE=Release \
            -DHUXERUI_HOME="${{ github.workspace }}/.cache/HuxerUI" "${extra[@]}"
      - name: Build preview
        run: cmake --build build-release --config Release --target example_pdf --parallel 2
      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "$env:APP_NAME-$env:PDF_PREVIEW_VERSION-windows-x64.zip"
          $stage = "release/$env:APP_NAME-$env:PDF_PREVIEW_VERSION-windows-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "build-release/Release/example_pdf.exe" $stage
          Copy-Item "build-release/Release/pdfium.dll" $stage
          Copy-Item "build-release/Release/example_pdf.resources" $stage -Recurse
          Copy-Item "VERSION" $stage
          Copy-Item "LICENSE" $stage
          Copy-Item "third_party/pdfium" $stage -Recurse
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $redistRoot = Join-Path $vs "VC/Redist/MSVC"
          $toolset = Get-ChildItem (Join-Path $vs "VC/Tools/MSVC") -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $redist = $null
          if ($toolset) {
            $candidate = Join-Path $redistRoot $toolset.Name
            if (Test-Path $candidate) { $redist = Get-Item $candidate }
          }
          if (-not $redist) {
            $redist = Get-ChildItem $redistRoot -Directory |
              Where-Object { $_.Name -match '^\d+(\.\d+)+$' } |
              Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          }
          if (-not $redist) { throw "MSVC redistributable directory was not found" }
          $crt = Get-ChildItem (Join-Path $redist.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" |
            Select-Object -First 1
          if (-not $crt) { throw "MSVC x64 redistributable DLLs were not found under $($redist.FullName)" }
          Write-Host "Bundling MSVC runtime from $($crt.FullName)"
          Copy-Item (Join-Path $crt.FullName "*.dll") $stage
          $exe = Join-Path $stage "example_pdf.exe"
          $fileVersion = (Get-Item $exe).VersionInfo.FileVersion
          if ($fileVersion -ne $env:PDF_PREVIEW_VERSION) {
            throw "exe FileVersion $fileVersion does not match VERSION $env:PDF_PREVIEW_VERSION"
          }
          $productVersion = (Get-Item $exe).VersionInfo.ProductVersion
          if ($productVersion -ne $env:PDF_PREVIEW_VERSION) {
            throw "exe ProductVersion $productVersion does not match VERSION $env:PDF_PREVIEW_VERSION"
          }
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
          Get-Item $archive | Select-Object Name,Length
      - name: Package Linux preview
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="${APP_NAME}-${PDF_PREVIEW_VERSION}-${{ matrix.name }}.tar.gz"
          stage="release/${APP_NAME}-${PDF_PREVIEW_VERSION}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp build-release/example_pdf "$stage/"
          cp -r build-release/example_pdf.resources "$stage/"
          cp VERSION "$stage/"
          pdfium=$(find build-release/_deps -path '*/lib/libpdfium.so' -print -quit)
          test -n "$pdfium"
          cp "$pdfium" "$stage/libpdfium.so"
          cp LICENSE "$stage/"
          cp -r third_party/pdfium "$stage/"
          printf '%s\n' '#!/bin/sh' 'here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)' \
            'LD_LIBRARY_PATH="$here${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "$here/example_pdf" "$@"' > "$stage/pdf-preview"
          chmod +x "$stage/pdf-preview"
          test "$(cat "$stage/VERSION")" = "$PDF_PREVIEW_VERSION"
          grep -aqF "v${PDF_PREVIEW_VERSION} · Linux" "$stage/example_pdf" || {
            echo "compiled binary is missing the ${PDF_PREVIEW_VERSION} version label" >&2
            exit 1
          }
          tar -C release -czf "$archive" "$(basename "$stage")"
          ls -lh "$archive"
      - name: Package macOS preview
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          archive="${APP_NAME}-${PDF_PREVIEW_VERSION}-${{ matrix.name }}.zip"
          app="build-release/example_pdf.app"
          test -d "$app"
          pdfium=$(find build-release -path '*/pdfium-runtime/libpdfium.dylib' -print -quit)
          test -n "$pdfium"
          mkdir -p "$app/Contents/Frameworks"
          cp "$pdfium" "$app/Contents/Frameworks/libpdfium.dylib"
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$app/Contents/MacOS/example_pdf" 2>/dev/null || true
          codesign --force --deep --sign - "$app"
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$plist_version" = "$PDF_PREVIEW_VERSION"
          stage="release/${APP_NAME}-${PDF_PREVIEW_VERSION}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          cp VERSION "$stage/"
          cp LICENSE "$stage/"
          cp -r third_party/pdfium "$stage/"
          ditto -c -k --sequesterRsrc --keepParent "$stage" "$archive"
          ls -lh "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.name }}
          path: ${{ env.APP_NAME }}-*-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  android:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Check out verified HuxerUI revision
        uses: actions/checkout@v4
        with:
          repository: HuxerUI/HuxerUI
          ref: ${{ env.HUXERUI_REVISION }}
          path: .cache/HuxerUI
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK components
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
      - name: Resolve project version
        run: |
          set -euo pipefail
          version="$(cat VERSION | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION is not a semantic version: $version" >&2; exit 1; }
          echo "PDF_PREVIEW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build HuxerUI CLI
        run: |
          cmake -S .cache/HuxerUI/tools/huxerui_cli -B build-huxerui-cli -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-huxerui-cli --parallel 2
      - name: Make the Gradle wrapper executable
        run: chmod +x examples/preview/platform/android/gradlew
      - name: Package installable Android preview
        env:
          ORG_GRADLE_PROJECT_huxeruiAbis: ${{ matrix.abi }}
        run: ./build-huxerui-cli/huxerui package android --profile release --source .cache/HuxerUI
      - name: Verify the APK
        env:
          EXPECTED_ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          apk=$(find examples/preview/dist/android -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          stage="pdf-preview-${PDF_PREVIEW_VERSION}-android-${EXPECTED_ABI}.apk"
          cp "$apk" "$stage"
          entries="$RUNNER_TEMP/pdf-preview-apk-entries"
          unzip -Z1 "$stage" > "$entries"
          for lib in libexample_pdf.so libhuxerui.so libpdfium.so; do
            grep -Fx "lib/${EXPECTED_ABI}/${lib}" "$entries"
          done
          grep -Fx 'assets/huxerui/resources.bin' "$entries"
          grep -Fx 'assets/huxerui/pdf_demo/raw/guide.pdf' "$entries"
          test "$(awk -F/ '/^lib\/.*\.so$/ {print $2}' "$entries" | sort -u)" = "$EXPECTED_ABI"
          aapt2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          test -n "$aapt2"
          badging="$("$aapt2" dump badging "$stage")"
          printf '%s\n' "$badging" | grep -Fq "versionName='${PDF_PREVIEW_VERSION}'" || {
            echo "APK versionName does not match ${PDF_PREVIEW_VERSION}" >&2
            printf '%s\n' "$badging" | head -1 >&2
            exit 1
          }
          expected_code=$(( $(cut -d. -f1 <<< "$PDF_PREVIEW_VERSION") * 10000 + $(cut -d. -f2 <<< "$PDF_PREVIEW_VERSION") * 100 + $(cut -d. -f3 <<< "$PDF_PREVIEW_VERSION") ))
          printf '%s\n' "$badging" | grep -Fq "versionCode='${expected_code}'" || {
            echo "APK versionCode does not match ${expected_code}" >&2
            printf '%s\n' "$badging" | head -1 >&2
            exit 1
          }
          ls -lh "$stage"
      - name: Enable Android emulator acceleration
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the packaged preview
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            APK="$(ls pdf-preview-*-android-x86_64.apk)" \
            EXPECTED_VERSION="$(tr -d '[:space:]' < VERSION)" \
            bash .github/scripts/check-android-preview-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-android-${{ matrix.abi }}
          path: pdf-preview-*-android-${{ matrix.abi }}.apk
          if-no-files-found: error

  ios:
    name: iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check out verified HuxerUI revision
        uses: actions/checkout@v4
        with:
          repository: HuxerUI/HuxerUI
          ref: ${{ env.HUXERUI_REVISION }}
          path: .cache/HuxerUI
      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          sudo xcodebuild -license accept
          sudo xcodebuild -runFirstLaunch
      - name: Resolve project version
        run: |
          set -euo pipefail
          version="$(cat VERSION | tr -d '[:space:]')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION is not a semantic version: $version" >&2; exit 1; }
          echo "PDF_PREVIEW_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the Simulator app
        timeout-minutes: 25
        env:
          HUXERUI_HOME: ${{ github.workspace }}/.cache/HuxerUI
        run: |
          bash .github/scripts/build-ios-preview.sh > ios-build.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 1200); do
            if ! kill -0 "$pid" 2>/dev/null; then
              set +e
              wait "$pid"
              status=$?
              set -e
              cat ios-build.log
              exit $status
            fi
            sleep 1
          done
          echo "iOS build timed out" >&2
          ps -axo pid,ppid,etime,command | grep -E 'cmake|make|clang|libtool|codesign|xcodebuild' | head -80 >&2 || true
          tail -200 ios-build.log >&2
          kill -9 "$pid" 2>/dev/null || true
          exit 1
      - name: Show the iOS build log
        if: failure()
        run: cat ios-build.log || true
      - name: Verify and archive the Simulator app
        shell: bash
        run: |
          set -euo pipefail
          app=$(find examples/preview/dist/ios -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          test -f "$app/Frameworks/libpdfium.dylib"
          test -n "$(find "$app" -path '*/huxerui/resources.bin' -print -quit)"
          test -n "$(find "$app" -path '*/pdf_demo/raw/guide.pdf' -print -quit)"
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          test "$plist_version" = "$PDF_PREVIEW_VERSION" || {
            echo "CFBundleShortVersionString $plist_version does not match VERSION $PDF_PREVIEW_VERSION" >&2
            exit 1
          }
          test "$(cat "$app/VERSION")" = "$PDF_PREVIEW_VERSION"
          codesign --force --deep --sign - "$app"
          APP="$app" EXPECTED_VERSION="$PDF_PREVIEW_VERSION" bash .github/scripts/check-ios-preview-app.sh
          archive="${APP_NAME}-${PDF_PREVIEW_VERSION}-ios-simulator-$(uname -m).zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          ls -lh "$archive"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios-simulator
          path: pdf-preview-*-ios-simulator-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: |
      always() &&
      needs.desktop.result == 'success' &&
      needs.android.result == 'success' &&
      needs.ios.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.create_release)
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-*
          merge-multiple: true
          path: dist
      - name: List release assets
        shell: bash
        run: find dist -maxdepth 1 -type f | sort
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          notes="docs/releases/${TAG}.md"
          if [[ -f "$notes" ]]; then
            note_args=(--notes-file "$notes")
          else
            note_args=(--generate-notes)
          fi
          shopt -s nullglob
          assets=(dist/*)
          test "${#assets[@]}" -gt 0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --title "PDF Preview $TAG" "${note_args[@]}" "${assets[@]}"
          fi
